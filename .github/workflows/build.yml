name: Mojito - NetErnels-KernelSU-SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: neternels_defconfig
  CROSS_COMPILE: aarch64-linux-android-
  CROSS_COMPILE_ARM32: arm-linux-androideabi-
  CLANG_SOURCE: "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r563880c-13989888/clang-r563880c.tar.gz"
  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: backport-clone3
          fetch-depth: 1
          submodules: recursive

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip

      - name: Ajouter backslashxx KernelSU
        run: |
          git clone --depth=1 \
            https://github.com/backslashxx/KernelSU.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu

          # Fix 'conflicting types for avc_ss_reset': forward-declare struct selinux_avc
          # avant le premier #include "avc_ss.h" dans ksu.c, pour unifier la déclaration
          # d'avc_ss_reset (type file-scope) entre avc_ss_reset.h et selinux/rules.c.
          python3 - <<'EOF'
          import re
          p = 'KernelSU/kernel/ksu.c'
          s = open(p, encoding='utf-8').read()
          new, n = re.subn(r'^[ \t]*#include "avc_ss.h"',
                 'struct selinux_avc;\n#include "avc_ss.h"',
                 s, count=1, flags=re.M)
          assert n == 1, 'pattern #include "avc_ss.h" introuvable dans ksu.c'
          assert 'struct selinux_avc;' in new
          open(p, 'w', encoding='utf-8').write(new)
          print('ksu.c patched OK')
          EOF

          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> Kconfig

      - name: Télécharger et appliquer les patchs SuSFS
        run: |
          git clone --depth=1 -b kernel-4.14 https://github.com/nanix06/susfs4ksu.git susfs

          # 1. Patch du noyau
          patch -p1 --fuzz=3 < susfs/kernel_patches/kernel-4.14.patch
          patch -p1 --fuzz=3 < susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/susfs_fix_nameic.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/55_try_umount_for_susfs.patch || true

          # 2. Patch spécifique à KernelSU
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cd ..

      - name: Fix wakeup.c (cast int -> void* pour clang)
        run: |
          python3 - <<'EOF'
          import re
          p = 'drivers/base/power/wakeup.c'
          s = open(p, encoding='utf-8').read()
          new, n = re.subn(
              r'debugfs_create_file\("trace_marker",\s*0220,\s*debugfs_create_dir\("tracing",\s*NULL\),\s*1,\s*NULL\)',
              'debugfs_create_file("trace_marker", 0220, debugfs_create_dir("tracing", NULL), (void *)1, NULL)',
              s, count=1)
          assert n == 1, 'pattern trace_marker introuvable dans wakeup.c'
          open(p, 'w', encoding='utf-8').write(new)
          print('wakeup.c patched OK')
          EOF

      - name: Télécharger clang (prébuilt AOSP)
        run: |
          wget -q -O clang.tar.gz "$CLANG_SOURCE"
          mkdir -p clang
          tar -xf clang.tar.gz -C clang
          CLANG_BIN="$(dirname "$(find clang -type f -name clang -executable | grep '/bin/' | head -n1)")"
          echo "$GITHUB_WORKSPACE/$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Télécharger GCC 4.9 (prébuilt Google)
        run: |
          git clone --depth=1 -b "$GCC_64_BRANCH" "$GCC_64_SOURCE" gcc64
          git clone --depth=1 -b "$GCC_32_BRANCH" "$GCC_32_SOURCE" gcc32
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> "$GITHUB_PATH"

      - name: Configurer le noyau
        run: |
          mkdir -p out

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --disable KSU_KPROBES_KSUD
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK

          # vDSO 32-bit (clang ne trouve pas d'assembleur ARM32 -> désactivé)
          ./scripts/config --file out/.config --disable COMPAT_VDSO

          # SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-NetErnels❄-SuSFSඞ"

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Compiler le noyau
        run: |
          # Fix qcacld-3.0: -Werror dans Kbuild cppflags-y -> warnings upstream = erreurs
          # Ajouter -Wno-error après le -Werror pour neutraliser les warnings non critiques
          printf 'cppflags-y += -Wno-error=unused-but-set-variable -Wno-error=unused-variable\n' >> \
            drivers/staging/qcacld-3.0/Kbuild

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-march=armv8.2-a -Wno-int-conversion -Wno-incompatible-function-pointer-types -Wno-missing-prototypes -Wno-implicit-function-declaration -Wno-c23-extensions"

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Envoyer l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-NetErnels-Ksu-susfs
          path: release/
          if-no-files-found: error
