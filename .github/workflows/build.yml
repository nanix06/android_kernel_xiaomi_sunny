name: Mojito - NetErnels-KernelSU-SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: neternels_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1
          submodules: recursive

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            clang lld llvm
 
      - name: Ajouter backslashxx KernelSU
        run: |
          git clone --depth=1 \
            https://github.com/backslashxx/KernelSU.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> Kconfig
          
      - name: Télécharger et appliquer les patchs SuSFS
        run: |
          git clone --depth=1 -b kernel-4.14 https://github.com/nanix06/susfs4ksu.git susfs
          
          # 1. Patch du noyau
          patch -p1 --fuzz=3 < susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/susfs_fix_nameic.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/fix_stat.c.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/55_try_umount_for_susfs.patch || true
          
          # 2. Corriger le manque de déclaration inotify_mark_user_mask
          cat >> fs/notify/inotify/inotify.h << 'PATCH'
          #define INOTIFY_USER_MASK (IN_ALL_EVENTS | IN_ONESHOT | IN_EXCL_UNLINK)

          static inline __u32 inotify_mark_user_mask(struct fsnotify_mark *fsn_mark)
          {
                  return fsn_mark->mask & INOTIFY_USER_MASK;
          }
          PATCH

          # 2b. Corriger la déclaration manquante de struct selinux_avc
          sed -i '/^int avc_ss_reset/i struct selinux_avc;' security/selinux/include/avc_ss_reset.h

          # 2c. Supprimer le bloc de code mort de l'ancien inotify_fdinfo (fdinfo.c)
          python3 - << 'PY'
          import re
          p = 'fs/notify/fdinfo.c'
          s = open(p).read()
          # 1) retire le commentaire flottant IN_ALL_EVENTS
          s = re.sub(r'[ \t]*/\*\n[ \t]*\* IN_ALL_EVENTS represents all of the mask bits[\s\S]*?\*/\n', '', s)
          # 2) retire le bloc mort: u32 mask = mark->mask & IN_ALL_EVENTS; -> iput(inode);
          s, n = re.subn(r'[ \t]*u32[ \t]+mask[ \t]*=[ \t]*mark->mask[ \t]*&[ \t]*IN_ALL_EVENTS;[ \t]*\n(?:[ \t]*[^\n]*\n)*?[ \t]*iput\(inode\);[ \t]*\n', '', s)
          # 3) les labels nus suivis de } doivent garder une instruction
          s = re.sub(r'^([ \t]*[A-Za-z_][A-Za-z0-9_]*:[ \t]*)$(?=[^\n]*\n[ \t]*\})', r'\1 ;', s, flags=re.M)
          if n:
              open(p, 'w').write(s)
          print('fdinfo.c dead-code blocks removed:', n)
          PY

          # 3. Patch spécifique à KernelSU
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cd ..

      - name: Configurer le noyau
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          mkdir -p out

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --disable KSU_KPROBES_KSUD
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          # SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-NetErnels❄-SuSFSඞ"

          # Evite le build cassé du compat vDSO avec LLVM
          ./scripts/config --file out/.config --disable CONFIG_COMPAT_VDSO

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig
            
      - name: Compiler le noyau
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            KCFLAGS="-Wno-visibility -Wno-unused-but-set-variable -Wno-int-conversion -Wno-fortify-source" \
            LLVM=1 \
            LLVM_IAS=1

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Envoyer l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-NetErnels-KernelSU
          path: release/
          if-no-files-found: error
