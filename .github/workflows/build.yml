name: Mojito - Neternels-KernelSU-SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: neternels_defconfig
  CROSS_COMPILE: aarch64-none-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: backport-clone3
          fetch-depth: 1
          submodules: recursive

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Télécharger et installer Clang & ARM Toolchain
        run: |
          mkdir -p toolchains
          
          # Clang r383902b
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902b.tar.gz
          tar -xzf clang-r383902b.tar.gz -C toolchains/
          rm clang-r383902b.tar.gz

          # ARM GNU Toolchain 14.2
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          mkdir -p toolchains/aarch64-gcc
          tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -C toolchains/aarch64-gcc --strip-components=1
          rm arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz

      - name: Ajouter backslashxx KernelSU
        run: |
          git clone --depth=1 \
            https://github.com/backslashxx/KernelSU.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> Kconfig
          
      - name: Télécharger et appliquer les patchs SuSFS
        run: |
          git clone --depth=1 -b kernel-4.14 https://github.com/nanix06/susfs4ksu.git susfs
          
          # Appliquer le patch du noyau
          patch -p1 < susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          patch -p1 < susfs/kernel_patches/55_try_umount_for_susfs.patch || true
          
          # Correction automatique pour vfs_open (3 arguments -> 2 arguments)
          sed -i 's/vfs_open(&nd->path, file, current_cred())/vfs_open(\&nd->path, file)/g' fs/namei.c
          sed -i 's/vfs_open(&path, file, current_cred())/vfs_open(\&path, file)/g' fs/namei.c

          # Patch KernelSU
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cd ..

      - name: Configurer le noyau
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/bin:$GITHUB_WORKSPACE/toolchains/aarch64-gcc/bin:$PATH"

          mkdir -p out

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

          # (Le reste de vos scripts ./scripts/config ...)

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig
            
      - name: Compiler le noyau
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/bin:$GITHUB_WORKSPACE/toolchains/aarch64-gcc/bin:$PATH"

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Envoyer l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-STRIX-KernelSU
          path: release/
          if-no-files-found: error
