name: Mojito - NetErnels-KernelSU-susfs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: neternels_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1
          submodules: recursive

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            clang lld llvm
 
      - name: Télécharger et appliquer les patchs KernelSU et SuSFS
        run: |
          git clone --depth=1 -b kernel-4.14 https://github.com/nanix06/susfs4ksu.git susfs
          patch -p1 --fuzz=3 < susfs/kernel_patches/kernelsu-only.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/susfs_fix_nameic.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/fix_stat.c.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/55_try_umount_for_susfs.patch || true
          sed -i 's/inotify_mark_user_mask(mark)/(mark->mask \& IN_ALL_EVENTS)/g' fs/notify/fdinfo.c
          sed -i '/^orig_flow:$/a\\t\t;' fs/notify/fdinfo.c
          sed -i '0,/^static void susfs_run_sus_path_loop(void) {/s//void susfs_run_sus_path_loop(void) {/' fs/susfs.c

      - name: Ajouter KernelSU-Next
        run: |
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          sed -i 's/get_monotonic_boottime(&ts)/ktime_get_boottime_ts64(\&ts)/' KernelSU/kernel/sulog/event.c
        
          # 2. Patch spécifique à KernelSU
          cp susfs/kernel_patches/KernelSU/susfs_hook_only_official-legacy.patch KernelSU/
          cd KernelSU
          patch -p1 < susfs_hook_only_official-legacy.patch || true
          cd ..

      - name: Configurer le noyau
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          mkdir -p out

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          # SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MAP
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-NetErnels"

          # Evite le build cassé du compat vDSO avec LLVM
          ./scripts/config --file out/.config --disable CONFIG_COMPAT_VDSO

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig
            
      - name: Compiler le noyau
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            KCFLAGS="-Wno-visibility -Wno-unused-but-set-variable -Wno-int-conversion -Wno-fortify-source" \
            LLVM=1 \
            LLVM_IAS=1

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true

      - name: Créer boot.img (prêt pour fastboot)
        env:
          STOCK_BOOT_URL: ${{ github.event.inputs.stock_boot_url }}
        run: |
          set -e
          mkdir -p bootwork && cd bootwork

          # 1. boot.img stock
          if [ -n "$STOCK_BOOT_URL" ]; then
            wget -q -O stock_boot.img "$STOCK_BOOT_URL"
          elif [ -f "$GITHUB_WORKSPACE/stock_boot/boot.img" ]; then
            cp "$GITHUB_WORKSPACE/stock_boot/boot.img" stock_boot.img
          else
            echo "::error::Aucun boot.img stock : ajoute stock_boot/boot.img au repo ou renseigne stock_boot_url"
            exit 1
          fi

          # 2. magiskboot (extrait de l'APK Magisk)
          wget -q -O magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          # 3. Décompresser le boot stock
          ./magiskboot unpack stock_boot.img

          # 4. Choisir le kernel : si le dtb est séparé (header v2), Image.gz seul ; sinon Image.gz-dtb
          B="$GITHUB_WORKSPACE/out/arch/arm64/boot"
          if [ -f dtb ]; then
            KERNEL="$B/Image.gz"
          elif [ -f "$B/Image.gz-dtb" ]; then
            KERNEL="$B/Image.gz-dtb"
          else
            KERNEL="$B/Image.gz"
          fi
          echo "Kernel utilisé : $KERNEL"
          cp "$KERNEL" kernel

          # 5. Repack
          ./magiskboot repack stock_boot.img new-boot.img
          cp new-boot.img "$GITHUB_WORKSPACE/release/boot.img"

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS

      - name: Envoyer l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-NetErnels-KernelSU
          path: release/
          if-no-files-found: error
